<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VS Impostor Paradox</title>

<link rel="icon" href="icono.png" type="image/png">

<style>
@font-face {
    font-family: 'AmericanCaptain';
    src: url('american-captain.ttf');
}

body {
    margin: 0;
    background: #000;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    min-height: 100vh;
    overflow-x: hidden;
    text-align: center;
}

.starBG, .starFG {
    position: fixed;
    top: 0;
    left: 0;
    width: 200%;
    height: 200%;
    background-repeat: repeat;
    z-index: -1;
}

.starBG {
    background-image: url('starBG.png');
    background-size: 700px;
    opacity: 0.35;
    animation: bgMove 300s linear infinite;
}

.starFG {
    background-image: url('starFG.png');
    background-size: 500px;
    opacity: 0.7;
    animation: fgMove 180s linear infinite;
}

@keyframes bgMove {
    from { background-position: 0 0; }
    to { background-position: 0 -20000px; }
}

@keyframes fgMove {
    from { background-position: 0 0; }
    to { background-position: 0 -20000px; }
}

.top {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 40px;
}

.logo {
    width: 380px;
    margin-bottom: 20px;
    filter: drop-shadow(0 0 25px rgba(255,255,255,0.25));
}

.desc {
    font-family: Arial;
    max-width: 650px;
    opacity: 0.85;
    margin-bottom: 30px;
    line-height: 1.4;
}

.parts {
    margin-bottom: 30px;
}

.part h2 {
    font-family: 'AmericanCaptain';
    font-size: 28px;
    margin: 0;
}

.part p {
    opacity: 0.7;
    margin: 5px 0 15px 0;
}

.downloadWrap {
    position: relative;
    display: inline-block;
}

.downloadWrap::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 120%;
    height: 120%;
    transform: translate(-50%, -50%);
    background: white;
    filter: blur(35px);
    opacity: 0.25;
    z-index: -1;
    border-radius: 20px;
}

.downloadImg {
    width: 320px;
    cursor: pointer;
    transition: 0.3s;
}

.downloadImg:hover {
    transform: scale(1.05);
    filter: drop-shadow(0 0 20px white);
}

.downloadText {
    margin-top: 10px;
    font-family: 'AmericanCaptain';
    letter-spacing: 2px;
}

#countdown {
    margin-top: 40px;
    font-family: 'AmericanCaptain';
    font-size: 60px;
    padding: 20px 40px;
    border-radius: 20px;
    border: 2px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    box-shadow: 0 0 30px rgba(255,255,255,0.1);
}

.final {
    color: red;
    font-size: 80px;
    font-family: 'AmericanCaptain';
    text-shadow: 0 0 25px red, 0 0 60px red;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}
</style>
</head>

<body>

<div class="starBG"></div>
<div class="starFG"></div>

<div class="top">

    <img src="logo.png" class="logo">

    <p class="desc">
        This mod, based on the original VS Impostor, will offer a complete expansion and revamp of the mod's storyline.<br><br>
        Including <b>36 weeks</b>, <b>126 songs</b>, and <b>4 story sections</b>!
    </p>

    <div class="parts">
        <div class="part">
            <h2>Vs. Impostor Paradox [PART ONE]</h2>
            <p>Someday This Year</p>
        </div>

        <div class="part">
            <h2>Vs. Impostor Paradox [PART TWO]</h2>
            <p>2027</p>
        </div>
    </div>

    <a href="https://drive.google.com/file/d/1mbjDU6dhLVA-JyimDpUVG6vg__f3gvNS/view?usp=sharing" target="_blank">
        <div class="downloadWrap">
            <img src="DEMOART.png" class="downloadImg">
        </div>
    </a>

    <p class="downloadText">DOWNLOAD THE DEMO!</p>

    <div id="countdown">LOADING...</div>

</div>

<script>
const targetDate = new Date("July 31, 2026 00:00:00").getTime();
const countdownEl = document.getElementById("countdown");

function updateCountdown() {
    const now = Date.now();
    const distance = targetDate - now;

    if (distance <= 0) {
        document.body.innerHTML = "";

        const final = document.createElement("div");
        final.textContent = "THE PARADOX HAS BEGUN.";
        final.className = "final";

        document.body.appendChild(final);
        return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((distance / (1000 * 60)) % 60);
    const seconds = Math.floor((distance / 1000) % 60);

    countdownEl.textContent =
        `${days}D ${hours}H ${minutes}M ${seconds}S`;
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>

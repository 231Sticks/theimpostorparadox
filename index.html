<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delayed</title><style>
@font-face{font-family:AmericanCaptain;src:url('american-captain.ttf')}
html,body{margin:0;height:100%;overflow:hidden;background:#000}
body{display:flex;align-items:center;justify-content:center;font-family:AmericanCaptain}
body:before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.015),rgba(255,255,255,.015) 1px,transparent 1px,transparent 4px);pointer-events:none}
.starBG,.starFG,.nebula,canvas{position:fixed;inset:0}
.starBG{background:url(starBG.png);opacity:.35;animation:a 260s linear infinite}
.starFG{background:url(starFG.png);opacity:.65;animation:b 180s linear infinite}
@keyframes a{to{background-position:120px -20000px}}@keyframes b{to{background-position:-120px -20000px}}
.nebula{background:radial-gradient(circle at 30% 40%,rgba(120,0,150,.2),transparent 50%),radial-gradient(circle at 70% 60%,rgba(0,90,255,.15),transparent 45%)}
.msg{text-align:center;font-size:clamp(56px,7vw,120px);letter-spacing:8px;color:#fff;text-shadow:0 0 4px rgba(255,255,255,.6),0 0 10px rgba(255,255,255,.25);animation:p 4s ease-in-out infinite}
.msg span{display:block;margin-top:18px;color:#d41818;text-shadow:0 0 5px rgba(212,24,24,.9),0 0 12px rgba(212,24,24,.45),0 0 25px rgba(212,24,24,.2)}
@keyframes p{50%{transform:scale(1.008)}}
</style></head><body><canvas id=c></canvas><div class=starBG></div><div class=starFG></div><div class=nebula></div><div class=msg>THE PARADOX HAS BEEN<br><span>DELAYED</span></div>
<script>
const x=c.getContext('2d');function r(){c.width=innerWidth;c.height=innerHeight}onresize=r;r();let p=[...Array(70)].map(()=>({x:Math.random()*c.width,y:Math.random()*c.height,s:Math.random()*2+.4,v:Math.random()*.3+.1,a:Math.random()}));(function f(){x.clearRect(0,0,c.width,c.height);for(let o of p){o.y-=o.v;if(o.y<0){o.y=c.height;o.x=Math.random()*c.width}x.beginPath();x.arc(o.x,o.y,o.s,0,7);x.fillStyle=`rgba(255,255,255,${0.2+o.a*.8})`;x.fill()}requestAnimationFrame(f)})();
</script></body></html>

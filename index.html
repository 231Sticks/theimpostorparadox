<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Paradox Is Coming</title>

<style>
@font-face {
    font-family: 'AmericanCaptain';
    src: url('american-captain.ttf');
}

body {
    margin: 0;
    background: #000;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    text-align: center;
    position: relative;
}

.starBG, .starFG {
    position: fixed;
    top: 0;
    left: 0;
    width: 200%;
    height: 200%;
    background-repeat: repeat;
    z-index: -1;
}

.starBG {
    background-image: url('starBG.png');
    background-size: 700px;
    opacity: 0.35;
    animation: slowBG 300s linear infinite;
}

.starFG {
    background-image: url('starFG.png');
    background-size: 500px;
    opacity: 0.7;
    animation: slowFG 180s linear infinite;
}

@keyframes slowBG {
    from { background-position: 0 0; }
    to { background-position: 0 -20000px; }
}

@keyframes slowFG {
    from { background-position: 0 0; }
    to { background-position: 0 -20000px; }
}

h1 {
    font-family: 'AmericanCaptain';
    font-size: 90px;
    letter-spacing: 3px;
    margin-bottom: 30px;
    text-shadow: 0 0 20px rgba(255,255,255,0.35);
    user-select: none;
}

#countdown {
    font-family: 'AmericanCaptain';
    font-size: 70px;
    background: rgba(255,255,255,0.05);
    padding: 20px 40px;
    border-radius: 20px;
    border: 2px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(5px);
    box-shadow: 0 0 30px rgba(255,255,255,0.1);
    user-select: none;
}

.final {
    color: red;
    font-size: 80px;
    text-shadow: 0 0 25px red, 0 0 60px red;
    font-family: 'AmericanCaptain';
}
</style>
</head>

<body>

<div class="starBG"></div>
<div class="starFG"></div>

<h1 id="title">THE PARADOX IS COMING</h1>
<div id="countdown">LOADING...</div>

<script>
const targetDate = new Date("July 31, 2026 00:00:00").getTime();

const countdownEl = document.getElementById("countdown");
const titleEl = document.getElementById("title");

function updateCountdown() {
    const now = Date.now();
    const distance = targetDate - now;

    if (distance <= 0) {
        document.body.innerHTML = "";

        const finalText = document.createElement("div");
        finalText.textContent = "THE PARADOX HAS BEGUN.";
        finalText.className = "final";

        document.body.appendChild(finalText);
        return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((distance / (1000 * 60)) % 60);
    const seconds = Math.floor((distance / 1000) % 60);

    countdownEl.textContent =
        `${days}D ${hours}H ${minutes}M ${seconds}S`;
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
